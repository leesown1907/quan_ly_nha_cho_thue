databases:
  - name: nha57-db
    plan: free
    databaseName: nha57
    user: nha57_user

services:
  - type: web
    name: nha57-giang-vo
    runtime: node
    plan: free
    buildCommand: npm --prefix backend install && npm --prefix frontend install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nha57-db
          property: connectionString
